name: Deploy DDKLab

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare static DDKLab site
        run: |
          rm -rf dist
          mkdir -p dist/research
          cp index.html dsp-v5.js manifest.webmanifest sw.js 404.html ddklab-enhancements.js dist/
          cp research/index.html dist/research/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./ddklab-enhancements.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload DDKLab
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
