name: Build DDKLab Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature and metadata
        shell: bash
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK" ]; then
            echo "Signed APK found: $APK"
          elif [ -f "$UNSIGNED" ]; then
            echo "Release APK is unsigned; signing is required before distribution."
            exit 1
          else
            echo "No release APK found."
            exit 1
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DDKLab-Android-1.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDKLab-Android
          path: dist/DDKLab-Android-1.1.0.apk
          if-no-files-found: error
