name: Build DDKLab Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK for distribution
        shell: bash
        run: |
          # The unsigned release APK is intentionally retained for this first public build.
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/DDKLab-Android-1.1.0-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDKLab-Android
          path: dist/DDKLab-Android-1.1.0-unsigned.apk
          if-no-files-found: error

