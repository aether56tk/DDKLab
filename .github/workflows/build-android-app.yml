name: Build DDKLab Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create CI signing key
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ddklab-release.keystore" \
            -alias ddklab \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ddklab-ci-password \
            -keypass ddklab-ci-password \
            -dname "CN=DDKLab, OU=DDKLab, O=DDKLab, L=Local, ST=Local, C=IN"

      - name: Build signed APK
        working-directory: android
        env:
          DDKLAB_KEYSTORE: ${{ runner.temp }}/ddklab-release.keystore
          DDKLAB_STORE_PASSWORD: ddklab-ci-password
          DDKLAB_KEY_ALIAS: ddklab
          DDKLAB_KEY_PASSWORD: ddklab-ci-password
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Signed release APK was not produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DDKLab-Android-1.2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDKLab-Android-1.2.0
          path: dist/DDKLab-Android-1.2.0.apk
          if-no-files-found: error
