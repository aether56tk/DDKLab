name: Load DDKLab DSP v5
on:
  push:
    branches: [main]
    paths:
      - 'dsp-v5.js'
      - '.github/workflows/inject-dsp-v5.yml'
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, 'Load DSP v5 into app') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject DSP script into app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dsp-v5.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected DSP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load DSP v5 into app'
          git push
