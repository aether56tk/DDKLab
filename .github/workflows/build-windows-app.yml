name: Build DDKLab Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run detector tests when present
        shell: pwsh
        run: |
          if (Test-Path "tests/ddk-detector.test.cjs") {
            npm test
          } else {
            Write-Host "No committed detector test file found; continuing to application build."
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDKLab-Windows
          path: dist/DDKLab-Setup-*.exe
          if-no-files-found: error

      - name: Publish Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem "dist/DDKLab-Setup-*.exe" | Select-Object -First 1
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe.FullName --title "DDKLab $tag" --notes "DDKLab Windows desktop application. Local-only DDK analysis with deterministic DSP, waveform review, AMR/SMR analysis, local storage, and application PIN." --latest
          } else {
            gh release upload $tag $exe.FullName --clobber
          }
