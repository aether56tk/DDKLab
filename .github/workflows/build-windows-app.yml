name: Build DDKLab Windows App

on:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run detector tests when present
        shell: pwsh
        run: |
          if (Test-Path "tests/ddk-detector.test.cjs") {
            npm test
          } else {
            Write-Host "No committed detector test file found; continuing to application build."
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DDKLab-Windows
          path: dist/DDKLab-Setup-*.exe
          if-no-files-found: error

      - name: Publish Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref }}" -like "refs/heads/release/v*") {
            $tag = $tag.Substring(8)
          }
          $exe = Get-ChildItem "dist/DDKLab-Setup-*.exe" | Select-Object -First 1
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe.FullName --target "${{ github.sha }}" --title "DDKLab $tag" --notes "DDKLab Windows desktop application. Local-only DDK analysis with deterministic DSP, waveform review, AMR/SMR analysis, local storage, and application PIN." --latest
          } else {
            gh release upload $tag $exe.FullName --clobber
          }
