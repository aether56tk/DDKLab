name: DDKLab Browser Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Check browser JavaScript syntax
        run: |
          node --check dsp-v5.js
          node --check ddklab-enhancements.js
      - name: Check required browser entry files
        run: |
          test -f index.html
          test -f dsp-v5.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f 404.html
