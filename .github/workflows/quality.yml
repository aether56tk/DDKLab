name: DDKLab Browser Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Check browser JavaScript syntax
        run: |
          node --check dsp-v5.js
          node --check ddklab-enhancements.js
      - name: Check required browser entry files
        run: |
          test -f index.html
          test -f dsp-v5.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f 404.html
