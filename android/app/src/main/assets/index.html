<html lang="en">
<head>

<style>
:root{--bg:#0b0b0d;--card:#18191d;--line:#30323a;--text:#f5f7fb;--muted:#a4a8b3;--accent:#18d7b0;--warn:#ffc857;--wave:#7dd3fc;--marker:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(900px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:27px;font-weight:850}.sub,.status,.source{font-size:12px;color:var(--muted);line-height:1.5}.back{border:0;background:none;color:#fff;font-size:32px}.hero{text-align:center;padding:40px 8px}.hero h1{font-size:38px}.stack{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:11px;text-transform:uppercase;color:#aeb1ba;margin-bottom:7px;font-weight:750}.input,.select{width:100%;background:#101115;color:#fff;border:1px solid #3a3d46;border-radius:11px;padding:13px;font-size:16px}.btn{width:100%;min-height:56px;border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:#04100d;font-weight:850;font-size:16px}.btn:disabled{opacity:.42}.timer{text-align:center;font-size:70px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}.count{text-align:center;font-size:82px;font-weight:900}.countLabel{text-align:center;color:var(--muted)}.wave{width:100%;height:260px;background:#07080b;border-radius:12px;display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#101115;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:5px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}.warn{color:var(--warn)}.child{display:none;text-align:center}.road{height:58px;border-bottom:3px dashed #555;position:relative}.car{position:absolute;bottom:2px;left:0;font-size:31px}.rings{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:30px;margin:8px}.report{white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;background:#101115;padding:12px;border-radius:12px;overflow:auto}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.timer{font-size:58px}.count{font-size:72px}}

<body><main><div id="app"></div></main>
<script src="dsp-v5.js"></script>
<script>
'use strict';
const KEY='ddklab.sessions.v8';
const state={mode:'Adult',task:'AMR PA',age:'',pid:'',running:false,start:0,sr:48000,pcm:[],events:[],audio:null,stream:null,ctx:null,source:null,processor:null,silent:null,raf:0,dsp:null};
let sessions=[];try{sessions=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(sessions))sessions=[]}catch(e){sessions=[]}
const childGuide={6:{pa:4.2,ta:4.1,ka:3.6,pataka:1.0},7:{pa:4.7,ta:4.1,ka:3.8,pataka:1.0},8:{pa:4.8,ta:4.6,ka:4.2,pataka:1.2},9:{pa:5.0,ta:4.9,ka:4.4,pataka:1.3},10:{pa:5.4,ta:5.3,ka:4.6,pataka:1.4},11:{pa:5.6,ta:5.6,ka:5.0,pataka:1.5},12:{pa:5.9,ta:5.7,ka:5.1,pataka:1.6},14:{pa:6.1,ta:6.1,ka:5.4,pataka:1.8}};
const adultRef={pa:[6,7],ta:[6,7],ka:[5,6.5],pataka:[2.5,2.5]};
const geriatricRef={pa:[4.6,7.6],ta:[4.6,7.4],ka:[4,7],pataka:[1,2.6]};
function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shell(t){return '<div class="top"><button class="back" id="back">‹</button><div><div class="brand">'+esc(t)+'</div><div class="sub">Local deterministic DSP • '+(window.DDK_DSP_VERSION||'DSP unavailable')+'</div></div></div>'}function save(){try{localStorage.setItem(KEY,JSON.stringify(sessions.slice(0,100)))}catch(e){}}
function home(){$('app').innerHTML='<section class="hero"><h1>DDKLab</h1><p>15-second AMR/SMR assessment with deterministic acoustic peak detection, waveform verification and local storage.</p><div class="stack"><button class="btn" id="start">Start DDK Assessment</button><button class="btn" id="history" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">Session History</button><button class="btn" id="batch" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">Batch Validation</button><button class="btn" id="analytics" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">Validation Analytics</button></div></section><div class="card status"><b>Research mode</b><br>Automatic count is a preliminary DSP measurement. Verify waveform markers against human annotation before research conclusions.</div>';$('start').onclick=setup;$('history').onclick=history}
function setup(){$('app').innerHTML=shell('Assessment Setup')+'<div class="stack"><div class="card"><div class="grid"><div><div class="label">Age / clinical mode</div><select class="select" id="mode"><option>Adult</option><option>Child</option><option>Geriatric</option><option>Dysarthria</option></select></div><div><div class="label">Task</div><select class="select" id="task"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PATAKA</option></select></div><div><div class="label">Age in years</div><input class="input" id="age" type="number" min="2" max="100" placeholder="Child age"></div><div><div class="label">Participant code</div><input class="input" id="pid" placeholder="DDK-001"></div></div></div><div class="card status"><b>15-second fixed protocol</b><br>Microphone is prepared first. Countdown begins only after capture is ready. No pause and no replay.</div><button class="btn" id="go">Continue</button></div>';$('back').onclick=home;$('go').onclick=()=>{state.mode=$('mode').value;state.task=$('task').value;state.age=$('age').value;state.pid=$('pid').value.trim()||'UNSPECIFIED';record()}}
function record(){$('app').innerHTML=shell('DDK Assessment')+'<div class="stack"><div class="card"><b>'+esc(state.task)+'</b><div class="status">Repeat the target continuously for 15 seconds.</div></div><div class="card child" id="child"><div class="status">Child reinforcement</div><div class="rings" id="rings"></div><div class="road"><div class="car" id="car">🚗</div></div><div class="status" id="feedback">Keep producing the target.</div></div><div class="card"><div class="timer" id="timer">15</div><div class="count" id="live">0</div><div class="countLabel">automatic candidate events</div></div><div class="card"><svg id="wave" class="wave" viewBox="0 0 1100 260" preserveAspectRatio="none"></svg><div class="status">Yellow markers = automatic production candidates.</div></div><button class="btn" id="rec">START 15-SECOND RECORDING</button><div class="status" id="status">Audio stays on this device.</div></div>';$('back').onclick=()=>{if(!state.running)setup()};if(state.mode==='Child')$('child').style.display='block';$('rec').onclick=start;draw([],[])}
function start(){if(state.running)return;if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Microphone access unavailable.';return}$('rec').disabled=true;$('rec').textContent='PREPARING MICROPHONE…';navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(async stream=>{state.stream=stream;state.ctx=new (window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();state.sr=state.ctx.sampleRate;state.source=state.ctx.createMediaStreamSource(stream);state.processor=state.ctx.createScriptProcessor(4096,1,1);state.silent=state.ctx.createGain();state.silent.gain.value=0;state.processor.onaudioprocess=e=>{if(state.running)state.pcm.push(new Float32Array(e.inputBuffer.getChannelData(0)))};state.source.connect(state.processor);state.processor.connect(state.silent);state.silent.connect(state.ctx.destination);state.pcm=[];state.events=[];state.running=true;state.start=performance.now();$('rec').textContent='RECORDING…';$('status').textContent='Listening…';const tick=now=>{if(!state.running)return;const sec=(now-state.start)/1000;$('timer').textContent=Math.ceil(Math.max(0,15-sec));if(state.mode==='Child')$('car').style.left=Math.min(90,sec/15*90)+'%';if(sec>=15){finish();return}state.raf=requestAnimationFrame(tick)};state.raf=requestAnimationFrame(tick)}).catch(e=>{$('rec').disabled=false;$('rec').textContent='START 15-SECOND RECORDING';$('status').textContent='Microphone error: '+(e.message||'permission denied')})}
function flatten(){let n=0;for(const x of state.pcm)n+=x.length;const a=new Float32Array(n);let p=0;for(const x of state.pcm){a.set(x,p);p+=x.length}return a}function cleanup(){try{state.processor?.disconnect();state.source?.disconnect();state.silent?.disconnect();state.stream?.getTracks().forEach(t=>t.stop());state.ctx?.close()}catch(e){}state.processor=state.source=state.silent=state.stream=state.ctx=null}
function finish(){cancelAnimationFrame(state.raf);state.running=false;state.audio=flatten();state.dsp=window.detectDDK(state.audio,state.sr,state.mode,state.task==='SMR PATAKA');state.events=state.dsp.events||[];cleanup();$('timer').textContent='0';$('live').textContent=state.task==='SMR PATAKA'?Math.floor(state.events.length/3):state.events.length;draw(state.audio,state.events);$('rec').disabled=false;$('rec').textContent='VIEW RESULT';$('rec').onclick=result;$('status').textContent='DSP v6 complete • '+state.events.length+' raw candidates at '+state.sr+' Hz';if(state.mode==='Child')$('car').style.left='90%'}
function draw(audio,events){const W=1100,H=260;let p='';if(audio?.length){const step=Math.max(1,Math.floor(audio.length/W));for(let x=0;x<W;x++){let v=0,a=Math.min(audio.length-1,x*step),b=Math.min(audio.length,a+step);for(let i=a;i<b;i++)v=Math.max(v,Math.abs(audio[i]));p+=(x?' L':'M')+' '+x+' '+(130-v*234)}}$('wave').innerHTML='<rect width="1100" height="260" fill="#07080b"/><line x1="0" y1="130" x2="1100" y2="130" stroke="#252830"/>'+(p?'<path d="'+p+'" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>':'<text x="550" y="130" text-anchor="middle" fill="#777" font-size="16">Waveform will appear after recording</text>')+events.map(t=>{const x=Math.max(0,Math.min(W,t/15*W));return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="260" stroke="#ffd166" stroke-width="2"/>'}).join('')}
function key(){return state.task==='AMR PA'?'pa':state.task==='AMR TA'?'ta':state.task==='AMR KA'?'ka':'pataka'}function ref(){const k=key();if(state.mode==='Child'){const a=childGuide[Math.round(Number(state.age))]?.[k];return a?[a,a]:null}if(state.mode==='Geriatric')return geriatricRef[k];return adultRef[k]}function count(){return state.task==='SMR PATAKA'?Math.floor(state.events.length/3):state.events.length}function rate(){return count()/15}
function result(){const r=ref(),c=count(),v=rate(),e15=r?[r[0]*15,r[1]*15]:null;let label='REFERENCE NOT AVAILABLE',detail='No age-matched guide is loaded for this exact selection.';if(r){if(r[0]===r[1]){const tol=r[0]*.15;label=v<r[0]-tol?'BELOW REFERENCE':v>r[0]+tol?'ABOVE REFERENCE':'NEAR REFERENCE';detail='Guide value '+r[0].toFixed(2)+'/s; ±15% is a display aid, not a validated diagnostic cut-off.'}else{label=v<r[0]?'BELOW REFERENCE':v>r[1]?'ABOVE REFERENCE':'WITHIN REFERENCE RANGE';detail='Guide range '+r[0].toFixed(2)+'–'+r[1].toFixed(2)+'/s.'}}const expected=e15?(e15[0]===e15[1]?'≈'+Math.round(e15[0]):Math.round(e15[0])+'–'+Math.round(e15[1])):'not available';$('app').innerHTML=shell('DDK Result')+'<div class="stack"><div class="card"><div class="stats"><div class="stat">Raw events<b>'+state.events.length+'</b></div><div class="stat">Clinical count<b>'+c+'</b></div><div class="stat">Rate<b>'+v.toFixed(2)+'/s</b></div></div></div><div class="card"><h3>15-second normative comparison</h3><div class="pill warn">'+label+'</div><p><b>Expected in 15 s:</b> '+expected+' '+(state.task==='SMR PATAKA'?'cycles':'productions')+'</p><div class="status">Observed '+c+' in 15 s ('+v.toFixed(2)+'/s). '+detail+'</div></div><div class="card"><h3>Waveform verification</h3>'+svgResult(state.audio,state.events)+'</div><div class="card"><h3>DSP report</h3><div class="report">DDKLab — PRELIMINARY DSP REPORT\nParticipant: '+esc(state.pid)+'\nMode: '+esc(state.mode)+'\nTask: '+esc(state.task)+'\nProtocol: 15 seconds\nSample rate: '+state.sr+' Hz\nRaw candidate events: '+state.events.length+'\nClinical count: '+c+(state.task==='SMR PATAKA'?' complete PATAKA cycles':'')+'\nObserved rate: '+v.toFixed(2)+'/s\nExpected 15-sec guide: '+expected+'\nComparison: '+label+'\nDSP: '+(state.dsp?.debug?.version||'unknown')+'\n\nPRELIMINARY. Human waveform verification is required for research validation.</div></div><button class="btn" id="annotate">OPEN WAVEFORM ANNOTATION</button><button class="btn" id="done">FINISH & STORE LOCALLY</button></div>';$('back').onclick=setup;$('annotate').onclick=annotation;$('done').onclick=()=>{sessions.unshift({time:new Date().toISOString(),pid:state.pid,mode:state.mode,task:state.task,count:c,raw:state.events.length,rate:v});save();home()}}
function svgResult(audio,events){const W=1100;let p='';if(audio?.length){const step=Math.max(1,Math.floor(audio.length/W));for(let x=0;x<W;x++){let v=0,a=Math.min(audio.length-1,x*step),b=Math.min(audio.length,a+step);for(let i=a;i<b;i++)v=Math.max(v,Math.abs(audio[i]));p+=(x?' L':'M')+' '+x+' '+(130-v*234)}}return '<svg class="wave" viewBox="0 0 1100 260" preserveAspectRatio="none"><rect width="1100" height="260" fill="#07080b"/><line x1="0" y1="130" x2="1100" y2="130" stroke="#252830"/>'+(p?'<path d="'+p+'" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>':'')+events.map(t=>{const x=Math.max(0,Math.min(W,t/15*W));return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="260" stroke="#ffd166" stroke-width="2"/>'}).join('')+'</svg><div class="status">'+events.length+' automatic markers. Each marker must be checked against the acoustic waveform during validation.</div>'}

function annotation(){
  var auto=(state.events||[]).slice().sort(function(a,b){return a-b}), human=auto.slice(), mode='add';
  function esc2(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function render(){
    var W=1100,dur=15,a=state.audio||[],p='',step=a.length?Math.max(1,Math.floor(a.length/W)):1;
    for(var x=0;x<W&&a.length;x++){var v=0,s=Math.min(a.length-1,x*step),e=Math.min(a.length,s+step);for(var i=s;i<e;i++)v=Math.max(v,Math.abs(a[i]));p+=(x?' L':'M')+' '+x+' '+(130-v*234)}
    var html=shell('Waveform Annotation')+
      '<div class="stack">'+
      '<div class="card"><b>Human annotation</b><div class="status">Yellow = automatic. Green = human reference. Click waveform to add; switch to REMOVE to delete the nearest human marker.</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="addMode">ADD</button><button class="btn" id="removeMode" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">REMOVE</button></div></div>'+
      '<div class="card"><svg id="annWave" class="wave" viewBox="0 0 1100 260" preserveAspectRatio="none"><rect width="1100" height="260" fill="#07080b"/><line x1="0" y1="130" x2="1100" y2="130" stroke="#252830"/>'+
      (p?'<path d="'+p+'" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>':'')+
      auto.map(function(t){var x=t/dur*W;return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="260" stroke="#ffd166" stroke-width="1" opacity=".55"/>'}).join('')+
      human.map(function(t){var x=t/dur*W;return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="260" stroke="#18d7b0" stroke-width="3"/>'}).join('')+
      '</svg><div class="status">Automatic: '+auto.length+' · Human: '+human.length+'</div></div>'+
      '<div class="card"><div class="stats"><div class="stat">Automatic<b>'+auto.length+'</b></div><div class="stat">Human<b>'+human.length+'</b></div><div class="stat">Difference<b>'+(human.length-auto.length>0?'+':'')+(human.length-auto.length)+'</b></div></div></div>'+
      '<div class="card"><label class="label">Match tolerance (ms)</label><input class="input" id="tol" type="number" min="20" max="250" value="80"><div class="status">Events within this timing window are matched for validation.</div></div>'+
      '<button class="btn" id="validate">CALCULATE VALIDATION</button><button class="btn" id="backResult" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">BACK TO RESULT</button></div>';
    $('app').innerHTML=html;
    $('addMode').onclick=function(){mode='add';$('addMode').style.background='var(--accent)';$('removeMode').style.background='transparent'};
    $('removeMode').onclick=function(){mode='remove';$('removeMode').style.background='var(--accent)';$('addMode').style.background='transparent'};
    $('annWave').onclick=function(e){var r=e.currentTarget.getBoundingClientRect(),t=((e.clientX-r.left)/r.width)*dur;
      if(mode==='add'){human.push(t);human.sort(function(a,b){return a-b})}
      else if(human.length){var k=0;for(var j=1;j<human.length;j++)if(Math.abs(human[j]-t)<Math.abs(human[k]-t))k=j;if(Math.abs(human[k]-t)<.35)human.splice(k,1)}
      render();
    };
    $('validate').onclick=function(){validation(auto,human,Math.max(.02,Number($('tol').value)/1000))};
    $('backResult').onclick=result;
  }
  function validation(auto,human,tol){
    var used={},tp=0,err=0;
    human.forEach(function(h){var best=-1,bd=Infinity;auto.forEach(function(a,i){if(used[i])return;var d=Math.abs(a-h);if(d<=tol&&d<bd){bd=d;best=i}});if(best>=0){used[best]=1;tp++;err+=bd}});
    var fp=auto.length-tp,fn=human.length-tp,precision=tp/(tp+fp||1),recall=tp/(tp+fn||1),f1=2*precision*recall/(precision+recall||1),mae=tp?err/tp:0;
    sessions.unshift({type:'validation',time:new Date().toISOString(),pid:state.pid,mode:state.mode,task:state.task,automatic:auto.length,human:human.length,tp:tp,fp:fp,fn:fn,precision:precision,recall:recall,f1:f1,maeMs:mae*1000,toleranceMs:tol*1000});save();
    $('app').innerHTML=shell('Validation Report')+
      '<div class="stack"><div class="card"><div class="stats"><div class="stat">Precision<b>'+((precision*100).toFixed(1))+'%</b></div><div class="stat">Recall<b>'+((recall*100).toFixed(1))+'%</b></div><div class="stat">F1<b>'+((f1*100).toFixed(1))+'%</b></div></div></div>'+
      '<div class="card"><h3>Event agreement</h3><p>Automatic: <b>'+auto.length+'</b> · Human: <b>'+human.length+'</b></p><p>True positives: <b>'+tp+'</b> · False positives: <b>'+fp+'</b> · False negatives: <b>'+fn+'</b></p><p>Mean absolute timing error: <b>'+((mae*1000).toFixed(1))+' ms</b></p><p>Matching tolerance: <b>'+((tol*1000).toFixed(0))+' ms</b></p></div>'+
      '<div class="card report">Local validation record saved. This measures algorithm agreement with human annotation; it is not a diagnostic accuracy claim.</div>'+
      '<button class="btn" id="again">ANNOTATE AGAIN</button><button class="btn" id="home" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">HOME</button></div>';
    $('again').onclick=annotation;$('home').onclick=home;
  }
  render();
}



function validationAnalytics(){
  var records=sessions.filter(function(s){return s.type==='validation'});
  var tasks=['AMR PA','AMR TA','AMR KA','SMR PATAKA'];
  function group(task){return records.filter(function(s){return s.task===task})}
  function pct(v){return (v*100).toFixed(1)+'%'}
  function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
  function chart(title,items,max,label){
    var W=900,H=220,pad=45,bw=Math.max(24,Math.min(90,(W-pad*2)/(items.length*1.7)));
    var bars=items.map(function(it,i){var h=max?((it.value/max)*(H-70)):0,x=pad+i*(W-pad*2)/Math.max(1,items.length-1)-bw/2,y=H-35-h;return '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="#7dd3fc"/><text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" fill="#eee" font-size="12">'+label(it.value)+'</text><text x="'+(x+bw/2)+'" y="'+(H-12)+'" text-anchor="middle" fill="#aaa" font-size="12">'+esc(it.name)+'</text>'}).join('');
    return '<div class="card"><h3>'+title+'</h3><svg class="wave" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><rect width="'+W+'" height="'+H+'" fill="#07080b"/>'+bars+'</svg></div>';
  }
  var taskData=tasks.map(function(t){var g=group(t),tp=g.reduce(function(a,s){return a+(+s.tp||0)},0),fp=g.reduce(function(a,s){return a+(+s.fp||0)},0),fn=g.reduce(function(a,s){return a+(+s.fn||0)},0),pr=tp/(tp+fp||1),re=tp/(tp+fn||1),f=2*pr*re/(pr+re||1);return {name:t.replace('AMR ','').replace('SMR ',''),n:g.length,f1:f,mae:mean(g.map(function(s){return +s.maeMs||0})),err:mean(g.map(function(s){return (+s.human||0)-(+s.automatic||0)}))}});
  var countErr=records.map(function(s){return (+s.human||0)-(+s.automatic||0)}),timing=records.map(function(s){return +s.maeMs||0});
  var maxF=Math.max(.01,Math.max.apply(null,taskData.map(function(x){return x.f1}))),maxAbs=Math.max(1,Math.max.apply(null,countErr.map(Math.abs),[0]));
  var maxTiming=Math.max(1,Math.max.apply(null,timing,[0]));
  $('app').innerHTML=shell('Validation Analytics')+
   '<div class="stack"><div class="card"><div class="stats"><div class="stat">Sessions<b>'+records.length+'</b></div><div class="stat">Tasks<b>'+tasks.length+'</b></div><div class="stat">Mean count error<b>'+mean(countErr).toFixed(2)+'</b></div><div class="stat">Mean timing error<b>'+mean(timing).toFixed(1)+' ms</b></div></div></div>'+
   chart('F1 by task',taskData.map(function(x){return {name:x.name,value:x.f1}}),maxF,pct)+
   chart('Mean absolute timing error (ms)',taskData.map(function(x){return {name:x.name,value:x.mae}}),Math.max(1,Math.max.apply(null,taskData.map(function(x){return x.mae}))),function(v){return v.toFixed(0)+' ms'})+
   chart('Absolute count error',taskData.map(function(x){return {name:x.name,value:Math.abs(x.err)}}),Math.max(1,Math.max.apply(null,taskData.map(function(x){return Math.abs(x.err)}))),function(v){return v.toFixed(1)})+
   '<div class="card"><h3>Task breakdown</h3><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Task</th><th>N</th><th>F1</th><th>Mean count error</th><th>Mean timing MAE</th></tr>'+taskData.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.n+'</td><td>'+pct(x.f1)+'</td><td>'+x.err.toFixed(2)+'</td><td>'+x.mae.toFixed(1)+' ms</td></tr>'}).join('')+'</table></div></div>'+
   '<div class="card report">Interpretation: count error = human count − automatic count. Timing MAE is the average absolute timing difference for matched events. These metrics describe detector agreement with the stored human annotations; they are not clinical diagnostic accuracy.</div>'+
   '<button class="btn" id="exportAnalytics">EXPORT ANALYTICS CSV</button><button class="btn" id="backAnalytics" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">BACK</button></div>';
  $('exportAnalytics').onclick=function(){
    var rows=taskData.map(function(x){return {task:x.name,sessions:x.n,f1:x.f1,meanCountError:x.err,meanTimingMAEms:x.mae}});
    var body=rows.map(function(r){return Object.values(r).join(',')}).join('\n');
    var blob=new Blob(['task,sessions,f1,meanCountError,meanTimingMAEms\n'+body],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ddklab-validation-analytics.csv';a.click();setTimeout(function(){URL.revokeObjectURL(u)},500);
  };
  $('backAnalytics').onclick=home;
}

function batchValidation(){
  var records=sessions.filter(function(s){return s.type==='validation'});
  function csv(rows){return rows.map(function(r){return Object.keys(r).map(function(k){var v=r[k];return '"'+String(v??'').replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
  function download(name,data,type){var b=new Blob([data],{type:type||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},500)}
  var n=records.length,tp=records.reduce(function(a,s){return a+(+s.tp||0)},0),fp=records.reduce(function(a,s){return a+(+s.fp||0)},0),fn=records.reduce(function(a,s){return a+(+s.fn||0)},0),matches=records.filter(function(s){return s.tp>0}),mae=matches.length?matches.reduce(function(a,s){return a+(+s.maeMs||0)*(+s.tp||0)},0)/Math.max(1,tp):0;
  var precision=tp/(tp+fp||1),recall=tp/(tp+fn||1),f1=2*precision*recall/(precision+recall||1);
  $('app').innerHTML=shell('Batch Validation')+
    '<div class="stack"><div class="card"><h3>Dataset summary</h3><div class="stats"><div class="stat">Sessions<b>'+n+'</b></div><div class="stat">Precision<b>'+((precision*100).toFixed(1))+'%</b></div><div class="stat">Recall<b>'+((recall*100).toFixed(1))+'%</b></div><div class="stat">F1<b>'+((f1*100).toFixed(1))+'%</b></div></div></div>'+
    '<div class="card"><p>TP <b>'+tp+'</b> · FP <b>'+fp+'</b> · FN <b>'+fn+'</b> · Weighted timing MAE <b>'+mae.toFixed(1)+' ms</b></p><div class="status">Metrics are aggregated from locally saved human-vs-automatic validation sessions.</div></div>'+
    '<div class="card"><h3>Validation sessions</h3>'+(records.length?'<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Time</th><th>Participant</th><th>Task</th><th>Auto</th><th>Human</th><th>F1</th><th>MAE</th></tr>'+records.map(function(s){return '<tr><td>'+esc(new Date(s.time).toLocaleString())+'</td><td>'+esc(s.pid)+'</td><td>'+esc(s.task)+'</td><td>'+s.automatic+'</td><td>'+s.human+'</td><td>'+((s.f1*100).toFixed(1))+'%</td><td>'+Number(s.maeMs||0).toFixed(1)+' ms</td></tr>'}).join('')+'</table></div>':'<div class="status">No validation sessions yet. Annotate a recording first.</div>')+'</div>'+
    '<button class="btn" id="exportBatch">EXPORT VALIDATION CSV</button><button class="btn" id="clearBatch" style="background:transparent;color:#ff8b8b;border:1px solid #ff8b8b">CLEAR VALIDATION RECORDS</button><button class="btn" id="backBatch" style="background:transparent;color:var(--accent);border:1px solid var(--accent)">BACK</button></div>';
  $('exportBatch').onclick=function(){if(!records.length)return;download('ddklab-validation-dataset.csv',csv(records),'text/csv')};
  $('clearBatch').onclick=function(){if(confirm('Delete all local validation records?')){sessions=sessions.filter(function(s){return s.type!=='validation'});save();batchValidation()}};
  $('backBatch').onclick=home;
}

function history(){$('app').innerHTML=shell('Session History')+'<div class="card">'+(sessions.length?sessions.map(s=>'<p>'+esc(new Date(s.time).toLocaleString())+' • '+esc(s.task)+' • '+esc(s.count)+' • '+Number(s.rate).toFixed(2)+'/s</p>').join(''):'<div class="status">No local sessions yet.</div>')+'</div>';$('back').onclick=home}home();
</script><script src="./dsp-v5.js"></script>
<script src="client-sessions.js"></script></body></html>
