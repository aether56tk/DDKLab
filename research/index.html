<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDKLab</title><style>body{font:15px system-ui;background:#090e1c;color:#eef2ff;max-width:1100px;margin:auto;padding:18px}.card{background:#151c32;border:1px solid #2b3554;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}select,input,button{padding:11px;border-radius:9px;border:1px solid #3a4666;background:#10172b;color:white}button{background:#4355c7;font-weight:700}button:disabled{opacity:.4}canvas{width:100%;height:300px;background:#050914;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.stat{font-size:30px;font-weight:800}.muted{color:#9eabc7}.good{color:#9be7b2}.warn{color:#ffd479}</style></head><body><h1>DDKLab</h1><p class="muted">Local deterministic DSP • PRELIMINARY research detector</p><div class="card"><div class="grid"><label>AGE / CLINICAL MODE<select id="age"><option>Adult</option><option>Child</option><option>Geriatric</option><option>Dysarthria</option></select></label><label>TASK<select id="task"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PA-TA-KA</option></select></label><label>PARTICIPANT CODE<input id="pid" placeholder="DDK-001"></label></div><p><input id="consent" type="checkbox"> Consent/permission confirmed</p><div class="row"><button id="start">START</button><button id="stop" disabled>STOP & ANALYZE</button></div><p id="status">Ready</p><div id="modeInfo" class="muted"></div></div><div class="card"><canvas id="wave" width="1100" height="300"></canvas><p class="muted">Gold markers = detected clinical events. In SMR, PA-TA-KA is one cycle.</p></div><div class="grid"><div class="card">AUTOMATIC COUNT<div id="count" class="stat">—</div></div><div class="card">VERIFIED COUNT<div id="verified" class="stat">—</div><button id="minus">−1</button><button id="plus">+1</button></div><div class="card">RATE<div id="rate" class="stat">—</div></div><div class="card">QUALITY<div id="quality" class="warn">REVIEW</div></div></div><div class="card"><b>DSP REPORT</b><p id="report" class="muted">No analysis.</p></div><div class="card"><b>EVENTS</b><div id="events" class="muted">No events.</div></div><script>
const $=x=>document.getElementById(x),cv=$("wave"),g=cv.getContext("2d");let ac,stream,node,pcm=[],N=0,raw,last;function rms(a){let s=0;for(const v of a)s+=v*v;return Math.sqrt(s/(a.length||1))}function med(a){a=[...a].sort((x,y)=>x-y);return a.length?a[(a.length-1)>>1]:0}function info(){const m=$("age").value;$("modeInfo").textContent=m==='Dysarthria'?'Dysarthria mode: high-sensitivity detection for low-amplitude and temporally irregular DDK productions. It is a measurement aid, not a dysarthria diagnosis.':m==='Child'?'Child mode: sensitive detection + reinforcement-ready workflow.':m==='Geriatric'?'Geriatric mode: sensitive detection with conservative noise handling.':'Adult mode: standard detection.'}$("age").onchange=info;info();
function detect(x,sr,task,mode){const dur=x.length/sr;if(dur<.35)return {events:[],syll:[],count:0,dur,thr:0,noise:0};let y=new Float32Array(x.length),p=0;for(let i=0;i<x.length;i++){y[i]=x[i]-.97*p;p=x[i]}let hop=Math.max(64,Math.round(sr*.008)),win=Math.max(128,Math.round(sr*.012)),e=[];for(let i=0;i+win<y.length;i+=hop)e.push(rms(y.slice(i,i+win)));let base=med(e.slice(0,Math.min(60,e.length))),peak=Math.max(...e),sorted=[...e].sort((a,b)=>a-b),p90=sorted[Math.floor(sorted.length*.9)]||base;let sensitivity=mode==='Dysarthria'?0.055:mode==='Child'?0.075:mode==='Geriatric'?0.065:0.085;let thr=Math.max(base*1.35,base+(p90-base)*.08,peak*sensitivity);let cand=[];for(let i=2;i<e.length-2;i++){if(e[i]>=thr&&e[i]>=e[i-1]&&e[i]>=e[i+1]){let prom=e[i]-Math.max(Math.min(e[i-2],e[i-1]),Math.min(e[i+1],e[i+2]));if(prom>=Math.max(base*.15,peak*(mode==='Dysarthria'?.008:.015)))cand.push({t:i*hop/sr,a:e[i]})}}let gap=mode==='Dysarthria'?.045:mode==='Child'?.06:.075,out=[];for(const c of cand){if(!out.length||c.t-out[out.length-1].t>=gap)out.push(c);else if(c.a>out[out.length-1].a)out[out.length-1]=c}let smr=task.startsWith('SMR'),clinical=smr?Array.from({length:Math.floor(out.length/3)},(_,i)=>({t:(out[i*3].t+out[i*3+2].t)/2})):out;return {events:clinical.map(v=>v.t),syll:out.map(v=>v.t),count:clinical.length,dur,thr,noise:base,detector:mode==='Dysarthria'?'DSP-3-HIGH-SENSITIVITY-DYSARTHRIA':'DSP-3-STANDARD'}}
function draw(x,ev,dur){g.clearRect(0,0,cv.width,cv.height);g.strokeStyle='#5fd1ff';g.beginPath();let step=Math.max(1,Math.floor(x.length/cv.width));for(let q=0;q<cv.width;q++){let s=0,c=0;for(let i=q*step;i<Math.min(x.length,(q+1)*step);i++){s+=x[i];c++}let y=150-(c?s/c:0)*130;q?g.lineTo(q,y):g.moveTo(q,y)}g.stroke();g.strokeStyle='#f4c84d';for(const t of ev){let q=t/dur*cv.width;g.beginPath();g.moveTo(q,0);g.lineTo(q,300);g.stroke()}}
$("start").onclick=async()=>{if(!$("consent").checked)return $("status").textContent='Confirm consent first.';if(!$("pid").value.trim())return $("status").textContent='Enter participant code.';try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ac=new AudioContext();await ac.resume();const code=`class C extends AudioWorkletProcessor{process(i){let a=i[0]?.[0];if(a)this.port.postMessage(new Float32Array(a));return true}}registerProcessor('c',C)`;let u=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));await ac.audioWorklet.addModule(u);let src=ac.createMediaStreamSource(stream);node=new AudioWorkletNode(ac,'c');node.port.onmessage=e=>{if(node.rec){let a=new Float32Array(e.data);pcm.push(a);N+=a.length}};src.connect(node);node.connect(ac.destination);node.src=src;node.rec=true;$("start").disabled=true;$("stop").disabled=false;$("status").textContent='Recording…';}catch(e){$("status").textContent='Microphone error: '+e.message}};
$("stop").onclick=()=>{if(!node)return;node.rec=false;try{node.disconnect();node.src.disconnect();stream.getTracks().forEach(t=>t.stop())}catch{}raw=new Float32Array(N);let p=0;for(const a of pcm){raw.set(a,p);p+=a.length}last=detect(raw,ac.sampleRate,$("task").value,$("age").value);$("count").textContent=last.count;$("verified").textContent=last.count;$("rate").textContent=(last.count/last.dur).toFixed(2)+' '+($('task').value.startsWith('SMR')?'cycles/s':'productions/s');$("quality").textContent=last.count?'REVIEW — verify waveform':'NO EVENTS — inspect microphone/waveform';$("report").textContent=`${last.detector} | noise floor ${last.noise.toFixed(5)} | adaptive threshold ${last.thr.toFixed(5)} | detected syllable landmarks ${last.syll.length} | clinical events ${last.count}`;$("events").innerHTML=last.events.map((t,i)=>`<div>Event ${i+1}: ${t.toFixed(3)} s</div>`).join('')||'No events detected';draw(raw,last.events,last.dur);$("status").textContent='Analysis complete — automatic result is PRELIMINARY.';$("start").disabled=false;$("stop").disabled=true;pcm=[];N=0};$("minus").onclick=()=>{$("verified").textContent=Math.max(0,+$("verified").textContent-1)};$("plus").onclick=()=>{$("verified").textContent=+$("verified").textContent+1};
</script></body></html>
