<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DDKLab local DDK analysis"><title>DDKLab</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1000px;margin:auto;padding:24px}.card{background:#151c32;border:1px solid #2b3554;border-radius:16px;padding:20px;margin:14px 0}button,select{padding:12px 16px;border-radius:10px;border:0;margin:5px;background:#3949ab;color:white;font-weight:600}button:disabled{opacity:.4}canvas{width:100%;height:240px;background:#080c18;border-radius:12px}.stat{font-size:1.8rem;font-weight:700}.muted{color:#aab4d0}.row{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main><h1>DDKLab</h1><p class="muted">Local DDK analysis • PRELIMINARY detector</p><div class="card"><label>Mode <select id="mode"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PA-TA-KA</option></select></label><div class="row"><button id="start">START</button><button id="stop" disabled>STOP</button></div><p id="status">Ready</p></div><div class="card"><canvas id="wave"></canvas></div><div class="card"><div>Automatic result</div><div class="stat" id="count">0</div><div id="rate" class="muted">0 events/sec</div><div id="quality" class="muted">No recording</div></div><div class="card"><button id="csv">EXPORT CSV</button><button id="json">EXPORT JSON</button><p class="muted">Audio processing occurs locally. No recording is uploaded.</p></div></main><script>let ctx,stream,source,processor,buf=[],samples=0,recording=false,result={};const canvas=document.getElementById('wave'),c=canvas.getContext('2d');function draw(a){c.clearRect(0,0,canvas.width,canvas.height);c.strokeStyle='#7dd3fc';c.beginPath();let step=Math.max(1,Math.floor(a.length/canvas.width));for(let x=0;x<canvas.width;x++){let i=x*step;let y=canvas.height/2-(a[i]||0)*canvas.height*.42;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}function rms(a){let s=0;for(const x of a)s+=x*x;return Math.sqrt(s/a.length)}function detect(a,sr,smr){let env=[],hop=256,win=512;for(let i=0;i+win<a.length;i+=hop)env.push(rms(a.slice(i,i+win)));let mx=Math.max(...env)||1,noise=env.slice(0,Math.min(8,env.length)).sort((x,y)=>x-y)[Math.floor(Math.min(8,env.length)/2)]||0,thr=Math.max(noise*2,mx*.22),events=[],active=false,lastI=-Infinity;for(let i=1;i<env.length-1;i++){if(env[i]>thr&&env[i]>=env[i-1]&&env[i]>=env[i+1]){let t=i*hop/sr;if(!active||t-lastI>.12){events.push(t);lastI=t;active=true}}if(env[i]<thr*.65)active=false}return{events,count:smr?Math.floor(events.length/3):events.length,raw:events.length,duration:a.length/sr}}start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});ctx=new AudioContext();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);buf=[];samples=0;recording=true;processor.onaudioprocess=e=>{if(!recording)return;let a=e.inputBuffer.getChannelData(0);buf.push(new Float32Array(a));samples+=a.length;draw(a)};source.connect(processor);processor.connect(ctx.destination);start.disabled=true;stop.disabled=false;status.textContent='Recording…'}catch(e){status.textContent='Microphone error: '+e.message}};stop.onclick=()=>{recording=false;processor.disconnect();source.disconnect();stream.getTracks().forEach(t=>t.stop());let a=new Float32Array(samples),p=0;for(const b of buf){a.set(b,p);p+=b.length}draw(a);let smr=mode.value.startsWith('SMR'),r=detect(a,ctx.sampleRate,smr);result={mode:mode.value,count:r.count,rawEvents:r.raw,duration:r.duration,sampleRate:ctx.sampleRate,timestamps:r.events,detector:'PRELIMINARY-DSP-1',verifiedCount:null};count.textContent=r.count;rate.textContent=(r.count/r.duration).toFixed(2)+' '+(smr?'cycles':'productions')+'/sec';quality.textContent='Waveform available • Human verification required';status.textContent='Analysis complete — PRELIMINARY';start.disabled=false;stop.disabled=true};function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}csv.onclick=()=>download('ddklab-result.csv','mode,count,raw_events,duration,sample_rate\n'+[result.mode,result.count,result.rawEvents,result.duration,result.sampleRate].join(','),'text/csv');json.onclick=()=>download('ddklab-result.json',JSON.stringify(result,null,2),'application/json');</script></body></html>
