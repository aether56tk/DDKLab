<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><title>DDKLab</title>
<style>
:root{--bg:#0b0b0d;--card:#18191d;--line:#30323a;--text:#f5f7fb;--muted:#a4a8b3;--accent:#18d7b0;--warn:#ffc857;--danger:#ff6b6b;--wave:#7dd3fc;--marker:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(900px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:27px;font-weight:850}.sub{font-size:12px;color:var(--muted)}.hero{text-align:center;padding:42px 8px 26px}.hero h1{font-size:38px;margin:12px 0}.hero p{color:#d5d7dd;line-height:1.55}.stack{display:grid;gap:12px}.btn{width:100%;min-height:56px;border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:#04100d;font-weight:850;font-size:16px;cursor:pointer}.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn:disabled{opacity:.42;cursor:not-allowed}.back{border:0;background:none;color:#fff;font-size:32px;cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#aeb1ba;margin-bottom:7px;font-weight:750}.input,.select{width:100%;background:#101115;color:#fff;border:1px solid #3a3d46;border-radius:11px;padding:13px;font-size:16px}.timer{text-align:center;font-size:70px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}.count{text-align:center;font-size:82px;font-weight:900;line-height:1}.countLabel{text-align:center;color:var(--muted);margin:7px}.wave{width:100%;height:260px;background:#07080b;border-radius:12px;display:block}.status{font-size:13px;line-height:1.5;color:var(--muted)}.good{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#101115;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:5px}.child{display:none;text-align:center}.road{height:58px;border-bottom:3px dashed #555;position:relative}.car{position:absolute;bottom:2px;left:0;font-size:31px;transition:left .12s linear}.report{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:#101115;padding:12px;border-radius:12px;overflow:auto}.source{font-size:11px;color:#888d98;line-height:1.45}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#101115;border:1px solid var(--line);font-size:12px}.hidden{display:none}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.hero h1{font-size:32px}.timer{font-size:58px}.count{font-size:72px}}
</style>
</head>
<body><main><div id="app"></div></main>
<script>
'use strict';
const STORAGE_KEY='ddklab.sessions.v7';
const state={mode:'Adult',task:'AMR PA',age:'',pid:'',running:false,startTime:0,sampleRate:48000,pcm:[],events:[],stream:null,ctx:null,source:null,processor:null,silent:null,raf:0,audio:null};
let sessions=[];try{sessions=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(sessions))sessions=[];}catch(e){sessions=[];}

/* Published reference data used only as comparison guides.
   Kent et al. (1987), Table 12, reports child maximum-repetition means and adult ranges of means.
   Portnoy & Aronson (1982) reports normal-adult AMR means of 6.4, 6.1 and 5.7 syll/s for PA, TA and KA.
   A 2025 very-old-speaker study reports ranges for PA, TA, KA and PATAKA.
   These are not universal diagnostic cut-offs; language, protocol and population matter.
*/
const childGuide={
  6:{pa:[4.2,4.2],ta:[4.1,4.1],ka:[3.6,3.6],pataka:[1.0,1.0]},
  7:{pa:[4.7,4.7],ta:[4.1,4.1],ka:[3.8,3.8],pataka:[1.0,1.0]},
  8:{pa:[4.8,4.8],ta:[4.6,4.6],ka:[4.2,4.2],pataka:[1.2,1.2]},
  9:{pa:[5.0,5.0],ta:[4.9,4.9],ka:[4.4,4.4],pataka:[1.3,1.3]},
  10:{pa:[5.4,5.4],ta:[5.3,5.3],ka:[4.6,4.6],pataka:[1.4,1.4]},
  11:{pa:[5.6,5.6],ta:[5.6,5.6],ka:[5.0,5.0],pataka:[1.5,1.5]},
  12:{pa:[5.9,5.9],ta:[5.7,5.7],ka:[5.1,5.1],pataka:[1.6,1.6]},
  14:{pa:[6.1,6.1],ta:[6.1,6.1],ka:[5.4,5.4],pataka:[1.8,1.8]}
};
const adultRef={pa:[6.0,7.0],ta:[6.0,7.0],ka:[5.0,6.5],pataka:[2.5,2.5]};
const geriatricRef={pa:[4.6,7.6],ta:[4.6,7.4],ka:[4.0,7.0],pataka:[3.0/3,7.8/3]};
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveSessions(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(sessions.slice(0,100)))}catch(e){}}
function shell(title){return '<div class="top"><button class="back" id="backBtn">‹</button><div><div class="brand">'+esc(title)+'</div><div class="sub">Local deterministic DSP • PRELIMINARY research detector</div></div></div>'}
function home(){
 $('app').innerHTML='<section class="hero"><div style="font-size:54px">▮▮▮</div><h1>DDKLab</h1><p>Local AMR/SMR assessment with a fixed 15-second protocol, waveform review and automatic event analysis.</p><div class="stack"><button class="btn" id="startAssessmentBtn">Start DDK Assessment</button><button class="btn secondary" id="historyBtn">Session History</button></div></section><div class="card status"><b>Important</b><br>Automatic counting is a preliminary DSP measurement. Reference comparisons are research guides and are not automated diagnosis.</div>';
 $('startAssessmentBtn').onclick=setupView;$('historyBtn').onclick=historyView;
}
function setupView(){
 $('app').innerHTML=shell('Assessment Setup')+'<div class="stack"><div class="card"><div class="grid"><div><div class="label">Age / clinical mode</div><select class="select" id="modeSelect"><option>Adult</option><option>Child</option><option>Geriatric</option><option>Dysarthria</option></select></div><div><div class="label">Task</div><select class="select" id="taskSelect"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PATAKA</option></select></div><div><div class="label">Age in years</div><input class="input" id="ageInput" type="number" min="2" max="100" placeholder="Required for child"></div><div><div class="label">Participant code</div><input class="input" id="pidInput" placeholder="DDK-001"></div></div></div><div class="card status"><b>15-second protocol</b><br>Microphone is opened first. The 15-second countdown starts only after audio capture is ready. No pause and no replay.</div><button class="btn" id="continueBtn">Continue</button></div>';
 $('backBtn').onclick=home;$('continueBtn').onclick=()=>{state.mode=$('modeSelect').value;state.task=$('taskSelect').value;state.age=$('ageInput').value;state.pid=$('pidInput').value.trim()||'UNSPECIFIED';recordView()};
}
function recordView(){
 $('app').innerHTML=shell('DDK Assessment')+'<div class="stack"><div class="card"><b>'+esc(state.task)+'</b><div class="status" style="margin-top:6px">Repeat the target continuously for 15 seconds.</div></div><div class="card child" id="childPanel"><div class="status">Child reinforcement: keep producing to move the car.</div><div class="road"><div class="car" id="car">🚗</div></div></div><div class="card"><div class="timer" id="timer">15</div><div class="count" id="liveCount">0</div><div class="countLabel">automatic candidates / cycles</div></div><div class="card"><svg id="waveSvg" class="wave" viewBox="0 0 1100 260" preserveAspectRatio="none" aria-label="Waveform"></svg><div class="status" style="margin-top:7px">Yellow markers are automatic event candidates. Verify the waveform before using a result in research.</div></div><button class="btn" id="recordBtn">START 15-SECOND RECORDING</button><div class="status" id="recordStatus">Microphone access starts only after pressing the button. Audio remains local.</div></div>';
 $('backBtn').onclick=()=>{if(!state.running)setupView()};if(state.mode==='Child')$('childPanel').style.display='block';$('recordBtn').onclick=startRecording;drawWave([],[]);
}
function rms(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/(a.length||1))}
function detectEvents(audio,sr,mode){
 if(!audio.length)return [];
 const hop=128,win=512,env=[];for(let i=0;i+win<=audio.length;i+=hop)env.push(rms(audio.subarray(i,i+win)));if(env.length<8)return [];
 const sorted=env.slice().sort((a,b)=>a-b),noise=Math.max(sorted[Math.floor(sorted.length*.20)]||1e-5,1e-5);
 const sm=[];for(let i=0;i<env.length;i++){let s=0,n=0;for(let j=Math.max(0,i-4);j<=Math.min(env.length-1,i+4);j++){s+=env[j];n++}sm[i]=s/n}
 const q=sm.slice().sort((a,b)=>a-b),q60=q[Math.floor(q.length*.60)]||noise,q85=q[Math.floor(q.length*.85)]||q60;
 const high=Math.max(noise*1.7,q60*.42,q85*.30),low=Math.max(noise*1.35,high*.52);
 const minGap={Adult:.095,Child:.075,Geriatric:.105,Dysarthria:.115}[mode]||.095;
 const release=Math.max(3,Math.round(.085*sr/hop));const cand=[];let on=false,start=0,peak=0,last=0;
 for(let i=0;i<sm.length;i++){if(!on){if(sm[i]>=high){on=true;start=i;peak=i;last=i}}else{if(sm[i]>sm[peak])peak=i;if(sm[i]>=low)last=i;if(i-last>=release){if(peak-start>=1)cand.push(peak*hop/sr);on=false}}}
 if(on)cand.push(peak*hop/sr);const out=[];for(const t of cand)if(!out.length||t-out[out.length-1]>=minGap)out.push(t);return out;
}
function drawWave(audio,events){
 const s=$('waveSvg');if(!s)return;const W=1100,H=260;let path='';
 if(audio.length){const step=Math.max(1,Math.floor(audio.length/W));for(let x=0;x<W;x++){let v=0;const a=Math.min(audio.length-1,x*step),b=Math.min(audio.length,a+step);for(let i=a;i<b;i++)v=Math.max(v,Math.abs(audio[i]));const y=H/2-v*H*.9;path+=(x?' L':'M')+' '+x+' '+y}}
 s.innerHTML='<rect x="0" y="0" width="1100" height="260" fill="#07080b"/><line x1="0" y1="130" x2="1100" y2="130" stroke="#252830"/>'+(path?'<path d="'+path+'" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>':'<text x="550" y="130" text-anchor="middle" fill="#666b75" font-size="16">Waveform will appear after recording</text>')+events.map(t=>'<line x1="'+Math.max(0,Math.min(W,t/15*W))+'" y1="0" x2="'+Math.max(0,Math.min(W,t/15*W))+'" y2="260" stroke="#ffd166" stroke-width="2"/>').join('');
}
async function startRecording(){
 if(state.running)return;if(!navigator.mediaDevices?.getUserMedia){$('recordStatus').textContent='Microphone access is unavailable here.';return}
 $('recordBtn').disabled=true;$('recordBtn').textContent='PREPARING MICROPHONE…';$('recordStatus').textContent='Requesting microphone access…';
 try{state.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});state.ctx=new (window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();state.sampleRate=state.ctx.sampleRate;state.source=state.ctx.createMediaStreamSource(state.stream);state.processor=state.ctx.createScriptProcessor(4096,1,1);state.silent=state.ctx.createGain();state.silent.gain.value=0;state.processor.onaudioprocess=e=>{if(state.running)state.pcm.push(new Float32Array(e.inputBuffer.getChannelData(0)))};state.source.connect(state.processor);state.processor.connect(state.silent);state.silent.connect(state.ctx.destination);state.running=true;state.pcm=[];state.events=[];state.startTime=performance.now();$('recordBtn').textContent='RECORDING…';$('recordStatus').textContent='Listening… 15-second acquisition in progress.';const tick=now=>{if(!state.running)return;const elapsed=(now-state.startTime)/1000,remain=Math.max(0,15-elapsed);$('timer').textContent=Math.ceil(remain);if(state.mode==='Child')$('car').style.left=Math.min(92,elapsed/15*92)+'%';if(elapsed>=15){finishRecording();return}state.raf=requestAnimationFrame(tick)};state.raf=requestAnimationFrame(tick)}catch(err){state.running=false;$('recordBtn').disabled=false;$('recordBtn').textContent='START 15-SECOND RECORDING';$('recordStatus').textContent='Microphone error: '+(err?.message||'permission denied');cleanupAudio()}
}
function flattenChunks(){let total=0;for(const c of state.pcm)total+=c.length;const o=new Float32Array(total);let p=0;for(const c of state.pcm){o.set(c,p);p+=c.length}return o}
function cleanupAudio(){try{state.processor?.disconnect();state.source?.disconnect();state.silent?.disconnect();state.stream?.getTracks().forEach(t=>t.stop());state.ctx?.close()}catch(e){}state.processor=null;state.source=null;state.silent=null;state.stream=null;state.ctx=null}
function finishRecording(){cancelAnimationFrame(state.raf);state.running=false;const audio=flattenChunks();state.audio=audio;state.events=detectEvents(audio,state.sampleRate,state.mode);cleanupAudio();$('timer').textContent='0';$('liveCount').textContent=state.task==='SMR PATAKA'?Math.floor(state.events.length/3):state.events.length;drawWave(audio,state.events);$('recordBtn').disabled=false;$('recordBtn').textContent='VIEW RESULT';$('recordBtn').onclick=resultView;$('recordStatus').textContent='Processing complete. Captured '+audio.length+' samples at '+state.sampleRate+' Hz.';if(state.mode==='Child')$('car').style.left='92%'}
function reference(){const key=state.task==='AMR PA'?'pa':state.task==='AMR TA'?'ta':state.task==='AMR KA'?'ka':'pataka';if(state.mode==='Geriatric')return {range:geriatricRef[key],source:'Motor-Speech Performance in Very Old Speakers (2025)',unit:key==='pataka'?'cycles/s':'syllables/s'};if(state.mode==='Adult'||state.mode==='Dysarthria')return {range:adultRef[key],source:'Kent et al. (1987) / Portnoy & Aronson (1982) normal-adult reference data',unit:key==='pataka'?'cycles/s':'syllables/s'};const age=Math.round(Number(state.age));if(childGuide[age])return {range:childGuide[age][key],source:'Kent et al. (1987), Table 12; child maximum-repetition reference values',unit:key==='pataka'?'cycles/s':'syllables/s'};return null}
function clinicalCount(){return state.task==='SMR PATAKA'?Math.floor(state.events.length/3):state.events.length}
function rate(){return clinicalCount()/15}
function compare(){const r=reference(),v=rate();if(!r)return {label:'AGE-MATCHED REFERENCE NOT AVAILABLE',class:'warn',detail:'Published table does not provide this exact age in the current reference set.'};const lo=r.range[0],hi=r.range[1];if(lo===hi){const tol=lo*.15;return {label:v<lo-tol?'BELOW REFERENCE':v>lo+tol?'ABOVE REFERENCE':'NEAR REFERENCE',class:v<lo-tol||v>lo+tol?'warn':'good',detail:'Reference value '+lo.toFixed(2)+' '+r.unit+'; ±15% is only a display aid, not a validated clinical cut-off.'}}return {label:v<lo?'BELOW REFERENCE':v>hi?'ABOVE REFERENCE':'WITHIN REFERENCE RANGE',class:v<lo||v>hi?'warn':'good',detail:'Reference range '+lo.toFixed(2)+'–'+hi.toFixed(2)+' '+r.unit+'.'}}
function expected15(){const r=reference();if(!r)return null;return [r.range[0]*15,r.range[1]*15]}
function resultView(){
 const c=clinicalCount(),r=rate(),ref=reference(),cmp=compare(),e15=expected15(),duration=state.audio?state.audio.length/state.sampleRate:0;const refText=ref?(e15&&e15[0]!==e15[1]?ref.range[0].toFixed(2)+'–'+ref.range[1].toFixed(2)+' '+ref.unit+'  •  15-sec expected '+Math.round(e15[0])+'–'+Math.round(e15[1])+(ref.unit==='cycles/s'?' cycles':' syllables'):ref.range[0].toFixed(2)+' '+ref.unit+'  •  15-sec expected ≈'+Math.round(e15[0])+(ref.unit==='cycles/s'?' cycles':' syllables')):'No age-matched reference loaded';
 $('app').innerHTML=shell('DDK Result')+'<div class="stack"><div class="card"><div class="stats"><div class="stat">Raw events<b>'+state.events.length+'</b></div><div class="stat">Clinical count<b>'+c+'</b></div><div class="stat">Rate<b>'+r.toFixed(2)+'/s</b></div></div></div><div class="card"><h3 style="margin-top:0">15-second normative comparison</h3><div class="pill '+cmp.class+'">'+esc(cmp.label)+'</div><p><b>Expected reference:</b> '+esc(refText)+'</p><div class="status">Observed: '+r.toFixed(2)+' '+(ref?.unit||'units')+'. '+esc(cmp.detail)+'</div><div class="source" style="margin-top:9px">'+esc(ref?.source||'Reference source not available')+'</div></div><div class="card"><h3 style="margin-top:0">Waveform verification</h3>'+buildWaveSvg(state.audio,state.events)+'<div class="status" style="margin-top:8px">'+state.events.length+' automatic candidate markers. Verify each marker against the waveform and human annotation.</div></div><div class="card"><h3 style="margin-top:0">Final report</h3><div class="report">DDKLab — PRELIMINARY DSP REPORT\nParticipant: '+esc(state.pid)+'\nMode: '+esc(state.mode)+'\nTask: '+esc(state.task)+'\nProtocol: 15 seconds\nCaptured duration: '+duration.toFixed(2)+' s\nSample rate: '+state.sampleRate+' Hz\nRaw candidate events: '+state.events.length+'\nClinical count: '+c+(state.task==='SMR PATAKA'?' complete cycles':'')+'\nObserved rate: '+r.toFixed(2)+' /s\nExpected reference: '+refText+'\nComparison: '+cmp.label+'\n\nPRELIMINARY — not a diagnosis. Human waveform verification is required for research validation.</div></div><button class="btn" id="doneBtn">FINISH & STORE LOCALLY</button></div>';
 $('backBtn').onclick=setupView;$('doneBtn').onclick=()=>{sessions.unshift({time:new Date().toISOString(),pid:state.pid,mode:state.mode,task:state.task,raw:state.events.length,count:c,rate:r});saveSessions();home()};
}
function buildWaveSvg(audio,events){const W=1100,H=260;let p='';if(audio?.length){const step=Math.max(1,Math.floor(audio.length/W));for(let x=0;x<W;x++){let v=0,a=Math.min(audio.length-1,x*step),b=Math.min(audio.length,a+step);for(let i=a;i<b;i++)v=Math.max(v,Math.abs(audio[i]));const y=130-v*234;p+=(x?' L':'M')+' '+x+' '+y}}return '<svg class="wave" viewBox="0 0 1100 260" preserveAspectRatio="none"><rect width="1100" height="260" fill="#07080b"/><line x1="0" y1="130" x2="1100" y2="130" stroke="#252830"/>'+(p?'<path d="'+p+'" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>':'<text x="550" y="130" text-anchor="middle" fill="#777">No waveform captured</text>')+events.map(t=>{const x=Math.max(0,Math.min(W,t/15*W));return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="260" stroke="#ffd166" stroke-width="2"/>'}).join('')+'</svg>'}
function historyView(){$('app').innerHTML=shell('Session History')+'<div class="stack"><div class="card">'+(sessions.length?'<table class="table"><tr><th>Date</th><th>Task</th><th>Count</th><th>Rate</th></tr>'+sessions.map(s=>'<tr><td>'+esc(new Date(s.time).toLocaleString())+'</td><td>'+esc(s.task)+'</td><td>'+esc(s.count)+'</td><td>'+Number(s.rate).toFixed(2)+'/s</td></tr>').join('')+'</table>':'<div class="status">No local sessions stored yet.</div>')+'</div><button class="btn secondary" id="homeBtn">Back to DDKLab</button></div>';$('backBtn').onclick=home;$('homeBtn').onclick=home}
home();
</script><script src="./dsp-v5.js"></script>
</body></html>
