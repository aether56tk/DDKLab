<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="DDKLab — local AMR and SMR diadochokinetic analysis">
<link rel="manifest" href="manifest.webmanifest">
<title>DDKLab</title>
<style>
:root{--bg:#0b0b0d;--card:#19191c;--card2:#202024;--line:#303036;--text:#f5f5f7;--muted:#9b9ba3;--accent:#16d8b0;--accent2:#11cba6;--warn:#ffc857;--danger:#ff6b6b;--wave:#7dd3fc;--marker:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{width:min(760px,100%);margin:auto;padding:18px 18px 34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:27px;font-weight:800;letter-spacing:-.6px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.screen{min-height:calc(100vh - 90px)}.hero{text-align:center;padding:45px 6px 30px}.logo{font-size:58px;line-height:1;margin-bottom:24px}.hero h1{font-size:34px;margin:0 0 14px}.hero p{font-size:17px;line-height:1.5;color:#d5d5da;max-width:520px;margin:0 auto 32px}.btn{width:100%;min-height:58px;border:0;border-radius:18px;padding:14px 18px;background:var(--accent);color:#04100d;font-weight:800;font-size:17px;cursor:pointer}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.secondary{background:transparent;color:var(--accent);border:1px solid #23d8b1}.btn.small{width:auto;min-height:42px;border-radius:12px;font-size:14px;padding:10px 14px}.stack{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#b6b6bf;font-weight:700;margin-bottom:8px}.select,.input{width:100%;background:#111114;color:var(--text);border:1px solid #3a3a40;border-radius:12px;padding:14px;font-size:16px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modeTitle{font-size:18px;font-weight:750}.modeText{color:var(--muted);line-height:1.45;font-size:14px;margin-top:5px}.modeRow{display:flex;align-items:center;justify-content:space-between;gap:14px}.arrow{font-size:28px;color:var(--accent)}.back{border:0;background:none;color:#fff;font-size:28px;padding:0;cursor:pointer}.instruction{font-size:19px;font-weight:750;line-height:1.35}.pattern{color:var(--muted);font-size:16px;margin-top:8px}.countWrap{text-align:center;padding:35px 0 20px}.count{font-size:88px;line-height:.95;font-weight:850;letter-spacing:-4px}.countLabel{color:var(--muted);font-size:17px;margin-top:10px}.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 28px;min-height:20px}.dot{width:7px;height:18px;border-radius:5px;background:#20d9b6}.dot.dim{opacity:.2}.waveCard{padding:12px}.waveHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}canvas{display:block;width:100%;height:210px;background:#08080a;border-radius:12px}.status{font-size:13px;color:var(--muted);line-height:1.45}.status.warn{color:var(--warn)}.status.good{color:var(--accent)}.status.bad{color:var(--danger)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#111114;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:4px}.eventList{max-height:230px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#c9c9d0;line-height:1.8}.historyItem{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.historyItem:last-child{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#26262b;color:#dcdce2;font-size:11px}.childGame{display:none;text-align:center;padding:10px 0 18px}.road{height:54px;border-bottom:3px dashed #55555c;position:relative;margin:12px 8px}.car{position:absolute;left:0;bottom:3px;font-size:32px;transition:left .18s linear}.crash{animation:shake .25s linear 3}.hide{display:none!important}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:560px){main{padding:14px 14px 28px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding-top:55px}.hero h1{font-size:30px}.count{font-size:78px}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
'use strict';
const app=document.getElementById('app');
const STORE='ddklab.sessions.v3';
const CONFIG={
  'Adult':{minGap:.105,sensitivity:1.75},
  'Child':{minGap:.085,sensitivity:1.55},
  'Geriatric':{minGap:.115,sensitivity:1.55},
  'Dysarthria':{minGap:.135,sensitivity:1.35}
};
let state={screen:'home',age:'Adult',task:'AMR PA',pid:'',running:false,ctx:null,stream:null,source:null,processor:null,parts:[],total:0,sampleRate:48000,result:null,history:loadHistory(),lastDraw:null};
function loadHistory(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state.history.slice(0,100)))}catch(e){console.warn('Local storage unavailable',e)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(title,back=true){return `<div class="top">${back?'<button class="back" id="back">‹</button>':'<div style="width:32px"></div>'}<div style="flex:1;text-align:center"><div class="brand">${title}</div><div class="sub">Local DDK analysis • PRELIMINARY DSP</div></div><div style="width:32px"></div></div>`}
function home(){state.screen='home';app.innerHTML=`<section class="screen"><div class="hero"><div class="logo">▮▮▮</div><h1>DDKLab</h1><p>Local AMR & SMR assessment with waveform-based DDK event detection. Audio and session records remain on this device.</p><div class="stack"><button class="btn" id="startSession">Start DDK Assessment</button><button class="btn secondary" id="historyBtn">Session History</button></div></div><div class="card status"><b>Research status</b><br>Automatic detection is PRELIMINARY until validated against human-annotated recordings. Use the waveform and event markers for verification.</div></section>`;document.getElementById('startSession').onclick=setup;document.getElementById('historyBtn').onclick=historyView}
function setup(){state.screen='setup';app.innerHTML=`${shell('Assessment Setup')}<div class="stack"><div class="card"><div class="grid"><div><div class="label">Clinical / age mode</div><select class="select" id="age"><option>Adult</option><option>Child</option><option>Geriatric</option><option>Dysarthria</option></select></div><div><div class="label">Task</div><select class="select" id="task"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PATAKA</option></select></div><div class="full"><div class="label">Participant code</div><input class="input" id="pid" placeholder="DDK-001" maxlength="40"></div></div></div><div class="card"><div class="modeRow"><div><div class="modeTitle">Recording protocol</div><div class="modeText">One continuous recording. No pause and no replay. Stop once the production task is complete, then the DSP processes the full recording locally.</div></div></div></div><button class="btn" id="begin">Begin Recording</button></div>`;document.getElementById('back').onclick=home;document.getElementById('begin').onclick=()=>{state.age=document.getElementById('age').value;state.task=document.getElementById('task').value;state.pid=document.getElementById('pid').value||'UNSPECIFIED';recordingView()}}
function recordingView(){state.screen='record';state.result=null;app.innerHTML=`${shell('DDK Assessment')}<div class="stack"><div class="card"><div class="instruction">Repeat your ${state.task==='SMR PATAKA'?'syllable sequence':'syllable'} at a steady, maximum comfortable rate.</div><div class="pattern">Pattern: ${state.task.replace('AMR ','').replace('SMR ','pa-ta-ka').toLowerCase()}</div></div><div class="card childGame" id="childGame"><div style="font-size:14px;color:var(--muted)">Keep producing to move the car</div><div class="road"><div class="car" id="car">🚗</div></div></div><div class="countWrap"><div class="count" id="liveCount">0</div><div class="countLabel">productions detected</div></div><div class="dots" id="dots"></div><div class="card waveCard"><div class="waveHead"><span>WAVEFORM</span><span id="micState">Microphone ready</span></div><canvas id="wave" width="1000" height="420"></canvas></div><button class="btn" id="recordBtn">START RECORDING</button><div class="status" id="status">Microphone access is requested only when recording starts. Processing is local.</div></div>`;document.getElementById('back').onclick=()=>{if(!state.running)setup()};if(state.age==='Child')document.getElementById('childGame').style.display='block';document.getElementById('recordBtn').onclick=startRecording}
function drawWave(a,marks=[]){const c=document.getElementById('wave');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle='#25252b';g.lineWidth=1;g.beginPath();g.moveTo(0,c.height/2);g.lineTo(c.width,c.height/2);g.stroke();g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--wave');g.lineWidth=2;g.beginPath();const step=Math.max(1,Math.floor(a.length/c.width));for(let x=0;x<c.width;x++){let v=a[Math.min(a.length-1,x*step)]||0;let y=c.height/2-v*(c.height*.42);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--marker');g.lineWidth=2;for(const t of marks){const x=(t/(state.result?.duration||state.total/state.sampleRate||1))*c.width;g.beginPath();g.moveTo(x,0);g.lineTo(x,c.height);g.stroke()}}
function rmsFrame(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/(a.length||1))}
function median(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)]}
function smooth(a,n){const out=new Float32Array(a.length);let sum=0;for(let i=0;i<a.length;i++){sum+=a[i];if(i>=n)sum-=a[i-n];out[i]=sum/Math.min(i+1,n)}return out}
/* Deterministic envelope-based DDK detector. It deliberately counts production regions, not every local waveform maximum. */
function detectDDK(audio,sr,mode,isSMR){
  const hop=128, win=512, frames=[];
  for(let i=0;i+win<=audio.length;i+=hop)frames.push(rmsFrame(audio.subarray(i,i+win)));
  if(frames.length<8)return {events:[],duration:audio.length/sr,debug:{reason:'too_short'}};
  const early=frames.slice(0,Math.min(30,frames.length));
  const noise=median(early);
  const env=smooth(frames,5);
  const cfg=CONFIG[mode]||CONFIG.Adult;
  const q=env.slice().sort((a,b)=>a-b);
  const p70=q[Math.floor(q.length*.70)]||noise;
  const p90=q[Math.floor(q.length*.90)]||p70;
  const dynamic=Math.max(noise*cfg.sensitivity,p70*0.58,p90*0.30);
  const threshold=Math.max(dynamic,noise*1.25,1e-5);
  const refractory=Math.max(0.075,cfg.minGap);
  const candidates=[];
  let active=false,start=0,peak=-1,peakVal=0,lastAbove=-1;
  const closeGap=Math.max(2,Math.round(.055*sr/hop));
  for(let i=1;i<env.length-1;i++){
    const above=env[i]>threshold;
    if(above&&!active){active=true;start=i;peak=i;peakVal=env[i];lastAbove=i}
    if(active){if(env[i]>peakVal){peak=i;peakVal=env[i]}if(above)lastAbove=i;else if(i-lastAbove>=closeGap){const t=peak*hop/sr;if(t-(start*hop/sr)>.025)candidates.push({t,v:peakVal});active=false}}
  }
  if(active&&peak>=0)candidates.push({t:peak*hop/sr,v:peakVal});
  /* If a weak dysarthric production never cleanly crosses the region threshold, recover it from prominent envelope maxima. */
  if(candidates.length<2){
    for(let i=2;i<env.length-2;i++){
      if(env[i]>env[i-1]&&env[i]>=env[i+1]&&env[i]>threshold*.78){const t=i*hop/sr;if(!candidates.length||t-candidates[candidates.length-1].t>=refractory)candidates.push({t,v:env[i]})}
    }
  }
  const events=[];
  for(const c of candidates){
    if(!events.length){events.push(c.t);continue}
    const d=c.t-events[events.length-1];
    if(d>=refractory){events.push(c.t)}else if(c.v>0){/* keep the stronger event; never create a second peak inside one production */}
  }
  return {events,duration:audio.length/sr,debug:{noise,threshold,refractory,frames:frames.length}};
}
function renderDots(n){const el=document.getElementById('dots');if(!el)return;const max=Math.min(n,50);el.innerHTML=Array.from({length:max},()=>'<span class="dot"></span>').join('')+(n>50?`<span class="muted">+${n-50}</span>`:'')}
async function startRecording(){
  const status=document.getElementById('status');const btn=document.getElementById('recordBtn');
  try{
    state.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    state.ctx=new (window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();state.sampleRate=state.ctx.sampleRate;state.source=state.ctx.createMediaStreamSource(state.stream);state.processor=state.ctx.createScriptProcessor(4096,1,1);state.parts=[];state.total=0;state.running=true;btn.textContent='STOP & ANALYZE';btn.classList.add('secondary');document.getElementById('micState').textContent='Microphone active';status.textContent='Recording… continue without pausing. Press STOP & ANALYZE when finished.';state.processor.onaudioprocess=e=>{if(!state.running)return;const a=new Float32Array(e.inputBuffer.getChannelData(0));state.parts.push(a);state.total+=a.length;drawWave(a);};state.source.connect(state.processor);state.processor.connect(state.ctx.destination);
  }catch(e){status.textContent='Microphone error: '+e.message;status.className='status bad'}
  btn.onclick=state.running?stopRecording:startRecording;
}
function stopRecording(){
  state.running=false;const btn=document.getElementById('recordBtn');if(state.processor)state.processor.disconnect();if(state.source)state.source.disconnect();if(state.stream)state.stream.getTracks().forEach(t=>t.stop());if(state.ctx)state.ctx.close();const audio=new Float32Array(state.total);let p=0;for(const b of state.parts){audio.set(b,p);p+=b.length}const isSMR=state.task==='SMR PATAKA';const d=detectDDK(audio,state.sampleRate,state.age,isSMR);const cycles=isSMR?Math.floor(d.events.length/3):d.events.length;state.result={id:'DDK-'+Date.now(),participant:state.pid,age:state.age,task:state.task,events:d.events,automaticCount:cycles,syllableEvents:d.events.length,duration:d.duration,rate:(cycles/d.duration)||0,sampleRate:state.sampleRate,detectorVersion:'PRELIMINARY-DSP-3.0',timestamp:new Date().toISOString(),audio};state.history.unshift({...state.result,audio:null,verifiedCount:cycles,validity:'REVIEW'});persist();resultsView();}
function resultsView(){const r=state.result;state.screen='results';app.innerHTML=`${shell('DDK Results')}<div class="stack"><div class="card"><div class="label">Automatic result</div><div style="font-size:48px;font-weight:850">${r.automaticCount}</div><div class="muted">${r.task==='SMR PATAKA'?'complete PATAKA cycles':'AMR productions'}</div></div><div class="card waveCard"><div class="waveHead"><span>WAVEFORM + EVENT MARKERS</span><span>PRELIMINARY DSP</span></div><canvas id="wave" width="1000" height="420"></canvas></div><div class="stats"><div class="stat"><span class="muted">Verified count</span><b id="verified">${r.automaticCount}</b></div><div class="stat"><span class="muted">Rate</span><b>${r.rate.toFixed(2)} / sec</b></div><div class="stat"><span class="muted">Duration</span><b>${r.duration.toFixed(2)} s</b></div><div class="stat"><span class="muted">Detected events</span><b>${r.syllableEvents}</b></div></div><div class="card"><div class="label">Verification</div><div class="modeText">Review the yellow markers against the waveform. Automatic detection counts production regions; for SMR, every three detected syllable events form one PATAKA cycle.</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn small" id="minus">−1</button><button class="btn small" id="plus">+1</button></div></div><div class="card"><div class="label">Event timestamps</div><div class="eventList">${r.events.map((t,i)=>`${String(i+1).padStart(2,'0')} &nbsp; ${t.toFixed(3)} s`).join('<br>')||'No events detected'}</div></div><div class="card status warn">REVIEW REQUIRED — This detector is preliminary and must not be treated as validated research-grade measurement until compared with human annotations.</div><button class="btn" id="new">New Assessment</button></div>`;document.getElementById('back').onclick=()=>resultsView();drawWave(r.audio,r.events);document.getElementById('minus').onclick=()=>adjust(-1);document.getElementById('plus').onclick=()=>adjust(1);document.getElementById('new').onclick=setup}
function adjust(delta){if(!state.history.length)return;const h=state.history[0];h.verifiedCount=Math.max(0,(h.verifiedCount||0)+delta);persist();const v=document.getElementById('verified');if(v)v.textContent=h.verifiedCount}
function historyView(){state.screen='history';app.innerHTML=`${shell('Session History')}<div class="card">${state.history.length?state.history.map(h=>`<div class="historyItem"><div><b>${esc(h.participant)}</b><br><span class="muted">${esc(h.age)} • ${esc(h.task)} • ${new Date(h.timestamp).toLocaleString()}</span></div><div style="text-align:right"><span class="pill">${h.verifiedCount} count</span><br><span class="muted">${h.validity}</span></div></div>`).join(''):'<div class="muted">No sessions stored on this device.</div>'}</div><div class="card status">Sessions are stored locally on this device only. There is no account, cloud database, Firebase, or remote audio upload.</div>`;document.getElementById('back').onclick=home}
function boot(){home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
boot();
</script>
<script src="./dsp-v5.js"></script>
</body>
</html>
