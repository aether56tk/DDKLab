<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><meta name="description" content="DDKLab — local AMR and SMR diadochokinetic analysis">
<title>DDKLab</title>
<style>
:root{--bg:#0b0b0d;--card:#19191c;--line:#303036;--text:#f5f5f7;--muted:#9b9ba3;--accent:#16d8b0;--warn:#ffc857;--danger:#ff6b6b;--wave:#7dd3fc;--marker:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(820px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:27px;font-weight:800}.sub{font-size:12px;color:var(--muted)}.hero{text-align:center;padding:42px 8px 25px}.hero h1{font-size:36px;margin:0 0 12px}.hero p{color:#d4d4da;line-height:1.5}.stack{display:grid;gap:12px}.btn{width:100%;min-height:56px;border:0;border-radius:16px;padding:13px 16px;background:var(--accent);color:#04100d;font-weight:800;font-size:16px}.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn:disabled{opacity:.4}.back{border:0;background:none;color:#fff;font-size:30px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#aaaab2;margin-bottom:7px;font-weight:700}.input,.select{width:100%;background:#111114;color:#fff;border:1px solid #3a3a40;border-radius:11px;padding:13px;font-size:16px}.count{text-align:center;font-size:92px;font-weight:850;line-height:1}.countLabel{text-align:center;color:var(--muted);margin:8px}.timer{text-align:center;font-size:64px;font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums}.timer.ready{color:#fff}.wave{width:100%;height:230px;background:#08080a;border-radius:12px;display:block}.status{font-size:13px;line-height:1.5;color:var(--muted)}.good{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--danger)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#29292e;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#111114;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.child{display:none;text-align:center}.road{height:55px;border-bottom:3px dashed #555;position:relative}.car{position:absolute;bottom:2px;left:0;font-size:30px;transition:left .15s linear}.source{font-size:11px;color:#85858d;line-height:1.4}.report{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#101013;padding:12px;border-radius:12px;overflow:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.count{font-size:78px}.timer{font-size:56px}}
</style></head>
<body><main><div id="app"></div></main>
<script>
'use strict';
const KEY='ddklab.sessions.v4';
let history=[];try{history=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const childNorms={
6:{pa:[4.1,3.1],ta:[4.0,3.1],ka:[3.6,2.8],pata:[2.0,1.0],pataka:[.97,.55]},
7:{pa:[4.1,3.2],ta:[4.0,3.2],ka:[3.7,2.9],pata:[2.9,1.2],pataka:[1.00,.55]},
8:{pa:[4.7,3.5],ta:[4.5,3.4],ka:[4.1,3.5],pata:[2.4,1.2],pataka:[1.20,.70]},
9:{pa:[5.0,4.0],ta:[4.8,4.0],ka:[4.3,3.6],pata:[2.5,1.3],pataka:[1.30,.75]},
10:{pa:[5.4,4.5],ta:[5.2,4.5],ka:[4.6,4.0],pata:[2.7,1.4],pataka:[1.40,.80]},
11:{pa:[5.5,4.4],ta:[5.5,4.4],ka:[5.0,4.1],pata:[3.1,1.7],pataka:[1.50,.85]},
12:{pa:[5.9,4.9],ta:[5.7,4.7],ka:[5.1,4.3],pata:[3.1,1.7],pataka:[1.50,.85]},
13:{pa:[6.0,5.0],ta:[6.0,5.0],ka:[5.4,4.5],pata:[3.5,1.8],pataka:[1.70,.90]}
};
/* Reference values are rate guides derived from published DDK norms; they are NOT diagnostic cutoffs. */
const state={age:'Adult',task:'AMR PA',pid:'',ageYears:'',running:false,start:0,audio:[],sr:48000,events:[],duration:15,media:null,ctx:null,src:null,proc:null,analyser:null,raf:null,liveRms:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(0,100)))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(t){return `<div class="top"><button class="back" id="back">‹</button><div><div class="brand">${t}</div><div class="sub">Local DDK analysis • PRELIMINARY DSP</div></div></div>`}
function home(){document.getElementById('app').innerHTML=`<section class="hero"><div style="font-size:58px">▮▮▮</div><h1>DDKLab</h1><p>Local AMR/SMR assessment with deterministic acoustic event detection, a fixed 15-second protocol, waveform review and reference-range reporting.</p><div class="stack"><button class="btn" id="start">Start DDK Assessment</button><button class="btn secondary" id="hist">Session History</button></div></section><div class="card status"><b>Research safeguard</b><br>Automatic results are preliminary until validated against human-annotated recordings. Normative status is a reference comparison, not an automated diagnosis.</div>`;start.onclick=setup;hist.onclick=historyView}
function setup(){document.getElementById('app').innerHTML=shell('Assessment Setup')+`<div class="stack"><div class="card"><div class="grid"><div><div class="label">Mode</div><select class="select" id="age"><option>Adult</option><option>Child</option><option>Geriatric</option><option>Dysarthria</option></select></div><div><div class="label">Task</div><select class="select" id="task"><option>AMR PA</option><option>AMR TA</option><option>AMR KA</option><option>SMR PATAKA</option></select></div><div><div class="label">Age in years</div><input class="input" id="ageYears" type="number" min="2" max="100" placeholder="Required for child norms"></div><div><div class="label">Participant code</div><input class="input" id="pid" placeholder="DDK-001"></div></div></div><div class="card status"><b>15-second protocol</b><br>Press Start. The timer automatically counts 15 → 14 → … → 0. There is no pause or replay.</div><button class="btn" id="go">Continue</button></div>`;back.onclick=home;go.onclick=()=>{state.age=age.value;state.task=task.value;state.ageYears=ageYears.value;state.pid=pid.value||'UNSPECIFIED';recordView()}}
function recordView(){document.getElementById('app').innerHTML=shell('DDK Assessment')+`<div class="stack"><div class="card"><b>${esc(state.task)}</b><div class="status" style="margin-top:6px">Produce the target rapidly and accurately for the full 15 seconds.</div></div><div class="card child" id="child"><div class="status">Keep producing to move the car.</div><div class="road"><div class="car" id="car">🚗</div></div></div><div class="card"><div class="timer ready" id="timer">15</div><div class="count" id="count">0</div><div class="countLabel">detected events / cycles</div></div><div class="card"><canvas id="wave" class="wave" width="1000" height="460"></canvas></div><button class="btn" id="rec">START 15-SECOND RECORDING</button><div class="status" id="status">Audio stays on this device. The microphone is accessed only after you start.</div></div>`;back.onclick=()=>{if(!state.running)setup()};if(state.age==='Child')child.style.display='block';rec.onclick=start}
function rms(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/(a.length||1))}
function detect(audio,sr){const hop=128,win=512,e=[];for(let i=0;i+win<=audio.length;i+=hop)e.push(rms(audio.subarray(i,i+win)));if(e.length<5)return[];let sorted=e.slice().sort((a,b)=>a-b),noise=sorted[Math.floor(sorted.length*.2)]||1e-5,sm=[];for(let i=0;i<e.length;i++){let s=0,n=0;for(let j=Math.max(0,i-3);j<=Math.min(e.length-1,i+3);j++){s+=e[j];n++}sm[i]=s/n}let q=sm.slice().sort((a,b)=>a-b),p75=q[Math.floor(q.length*.75)]||noise,thr=Math.max(noise*1.65,p75*.48),cand=[];let active=false,peak=-1,last=-1,gap=Math.round(.06*sr/hop);for(let i=0;i<sm.length;i++){if(sm[i]>thr&&!active){active=true;peak=i;last=i}else if(active&&sm[i]>sm[peak]){peak=i;last=i}else if(active&&i-last>=gap){cand.push(peak*hop/sr);active=false}}if(active)cand.push(peak*hop/sr);let minGap={Adult:.105,Child:.085,Geriatric:.115,Dysarthria:.075}[state.age]||.105,out=[];for(const t of cand){if(!out.length||t-out[out.length-1]>=minGap)out.push(t)}return out}
function draw(audio,events){const c=document.getElementById('wave');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle='#25252b';g.beginPath();g.moveTo(0,c.height/2);g.lineTo(c.width,c.height/2);g.stroke();g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--wave');g.lineWidth=2;g.beginPath();const step=Math.max(1,Math.floor(audio.length/c.width));for(let x=0;x<c.width;x++){const v=audio[Math.min(audio.length-1,x*step)]||0,y=c.height/2-v*c.height*.42;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--marker');g.lineWidth=2;for(const t of events){const x=t/15*c.width;g.beginPath();g.moveTo(x,0);g.lineTo(x,c.height);g.stroke()}}
async function start(){if(state.running)return;try{state.running=true;state.audio=[];state.events=[];state.start=performance.now();rec.disabled=true;rec.textContent='RECORDING…';status.textContent='Listening… produce continuously for 15 seconds.';const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});state.media=stream;state.ctx=new (window.AudioContext||window.webkitAudioContext)();await state.ctx.resume();state.sr=state.ctx.sampleRate;state.src=state.ctx.createMediaStreamSource(stream);state.analyser=state.ctx.createAnalyser();state.analyser.fftSize=2048;state.src.connect(state.analyser);const buf=new Float32Array(state.analyser.fftSize);let lastT=0;const tick=now=>{if(!state.running)return;state.analyser.getFloatTimeDomainData(buf);state.audio.push(...buf);const elapsed=(now-state.start)/1000;const remain=Math.max(0,15-elapsed);timer.textContent=Math.ceil(remain);timer.classList.remove('ready');const rr=rms(buf);count.textContent=state.events.length;draw(state.audio.slice(-state.sr*2),[]);if(state.age==='Child'){car.style.left=Math.min(92,elapsed/15*92)+'%'}if(elapsed>=15){finish();return}state.raf=requestAnimationFrame(tick)};requestAnimationFrame(tick)}catch(e){state.running=false;rec.disabled=false;status.textContent='Microphone error: '+e.message}}
function finish(){cancelAnimationFrame(state.raf);state.running=false;try{state.media?.getTracks().forEach(t=>t.stop());state.ctx?.close()}catch(e){}const audio=new Float32Array(state.audio);state.duration=Math.min(15,audio.length/state.sr);state.events=detect(audio,state.sr);let n=state.events.length;if(state.task==='SMR PATAKA')n=state.events.length;count.textContent=n;draw(audio,state.events);timer.textContent='0';rec.textContent='VIEW RESULT';rec.disabled=false;rec.onclick=resultView;status.textContent='Processing complete. Review the waveform markers before using the result for research validation.';if(state.age==='Child')car.style.left='92%'}
function norm(){const age=Number(state.ageYears);if(state.age!=='Child'||!childNorms[age])return null;const key=state.task==='AMR PA'?'pa':state.task==='AMR TA'?'ta':state.task==='AMR KA'?'ka':'pataka';const r=childNorms[age][key];return r?{low:r[0],high:r[1],source:'Fletcher (1972) child DDK reference, transformed to 15-s rate guidance'}:null}
function resultView(){const n=state.events.length,rate=n/15,ref=norm();let statusText='No validated reference range loaded for this age/task/population.';let cls='warn',expected='Not available';if(ref){let low=ref.low,high=ref.high;if(state.task==='SMR PATAKA'){expected=`${(low*15).toFixed(1)}–${(high*15).toFixed(1)} cycles/15 s`}else{expected=`${(low*15).toFixed(0)}–${(high*15).toFixed(0)} productions/15 s`}if(rate>=low&&rate<=high){statusText='Within the selected published reference guide.';cls='good'}else{statusText='Outside the selected published reference guide; clinical interpretation is required.';cls='bad'}}document.getElementById('app').innerHTML=shell('DDK Result')+`<div class="stack"><div class="stats"><div class="stat"><span class="status">Automatic count</span><b>${n}</b></div><div class="stat"><span class="status">Rate / 15 s</span><b>${rate.toFixed(2)}/s</b></div></div><div class="card"><div class="label">Normative comparison</div><div class="${cls}" style="font-size:20px;font-weight:800">${esc(statusText)}</div><div class="status" style="margin-top:8px">Expected reference: ${esc(expected)}</div></div><div class="card"><canvas id="wave" class="wave" width="1000" height="460"></canvas></div><div class="card status"><b>Research status</b><br>Automatic count = ${n}. Verify against waveform/human annotation before treating it as ground truth.</div><div class="card"><div class="label">Reference</div><div class="source">${ref?esc(ref.source):'No universal reference is applied. Adult, geriatric and dysarthria norms vary by population, language, task and protocol. Add/validate a local reference dataset before clinical classification.'}</div></div><button class="btn" id="report">GENERATE LOCAL REPORT</button><button class="btn secondary" id="new">NEW ASSESSMENT</button></div>`;back.onclick=recordView;draw(new Float32Array(state.audio),state.events);report.onclick=makeReport;new.onclick=home}
function makeReport(){const ref=norm();const r={app:'DDKLab',version:'Normative-15s-v1',participant:state.pid,mode:state.age,age:state.ageYears||null,task:state.task,duration_s:15,automatic_count:state.events.length,rate_per_s:Number((state.events.length/15).toFixed(4)),events_s:state.events.map(x=>Number(x.toFixed(4))),normative_reference:ref?ref.source:null,normative_expected_15s:ref?{low:Number((ref.low*15).toFixed(2)),high:Number((ref.high*15).toFixed(2))}:null,interpretation:ref?(state.events.length/15>=ref.low&&state.events.length/15<=ref.high?'WITHIN_REFERENCE_GUIDE':'OUTSIDE_REFERENCE_GUIDE'):'REFERENCE_NOT_LOADED',research_note:'Automatic result is preliminary and requires human-annotated validation.'};history.unshift(r);save();const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`DDKLab_${state.pid}_${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)}
function historyView(){document.getElementById('app').innerHTML=shell('Session History')+`<div class="stack"><div class="card">${history.length?history.slice(0,30).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #303036"><b>${esc(x.participant)}</b> · ${esc(x.task)} · ${x.automatic_count} · ${esc(x.interpretation||'')}</div>`).join(''):'No sessions stored locally.'}</div><button class="btn secondary" id="clear">Clear local history</button></div>`;back.onclick=home;clear.onclick=()=>{if(confirm('Delete all local session metadata?')){history=[];save();historyView()}}}
home();
</script></body></html>
